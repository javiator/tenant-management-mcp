# Google Cloud Build configuration for TM MCP Server
# Automatically builds and deploys on git push
#
# Setup:
#   1. Connect your repository to Cloud Build
#   2. Create a build trigger with this file
#   3. Set substitution variables in the trigger

substitutions:
  _SERVICE_NAME: tm-mcp-server
  _REGION: us-central1
  _IMAGE_NAME: tm-mcp

steps:
  # Step 1: Build the Docker image
  - name: 'gcr.io/cloud-builders/docker'
    id: 'build-image'
    args:
      - 'build'
      - '-t'
      - 'gcr.io/$PROJECT_ID/${_IMAGE_NAME}:$COMMIT_SHA'
      - '-t'
      - 'gcr.io/$PROJECT_ID/${_IMAGE_NAME}:latest'
      - '.'
    timeout: 600s

  # Step 2: Push the image to Container Registry
  - name: 'gcr.io/cloud-builders/docker'
    id: 'push-image'
    args:
      - 'push'
      - 'gcr.io/$PROJECT_ID/${_IMAGE_NAME}:$COMMIT_SHA'
    waitFor: ['build-image']

  # Step 3: Push the latest tag
  - name: 'gcr.io/cloud-builders/docker'
    id: 'push-latest'
    args:
      - 'push'
      - 'gcr.io/$PROJECT_ID/${_IMAGE_NAME}:latest'
    waitFor: ['build-image']

  # Step 4: Deploy to Cloud Run
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    id: 'deploy'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - '${_SERVICE_NAME}'
      - '--image'
      - 'gcr.io/$PROJECT_ID/${_IMAGE_NAME}:$COMMIT_SHA'
      - '--region'
      - '${_REGION}'
      - '--platform'
      - 'managed'
      - '--allow-unauthenticated'
      - '--port'
      - '8000'
      - '--memory'
      - '512Mi'
      - '--cpu'
      - '1'
      - '--timeout'
      - '300'
      - '--max-instances'
      - '10'
      - '--min-instances'
      - '0'
      - '--set-secrets'
      - 'MCP_API_KEYS=mcp-api-keys:latest,BACKEND_MCP_API_TOKEN=backend-token:latest'
      - '--set-env-vars'
      - 'BACKEND_MCP_BASE_URL=${_BACKEND_URL}'
    waitFor: ['push-image']
    timeout: 600s

# Store images in Container Registry
images:
  - 'gcr.io/$PROJECT_ID/${_IMAGE_NAME}:$COMMIT_SHA'
  - 'gcr.io/$PROJECT_ID/${_IMAGE_NAME}:latest'

# Build options
options:
  machineType: 'N1_HIGHCPU_8'
  logging: CLOUD_LOGGING_ONLY

# Total timeout for the build
timeout: 1200s

# Tags for organizing builds
tags:
  - 'tm-mcp-server'
  - 'cloud-run'
